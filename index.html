<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>uny connect 일본 인플루언서 공식 미디어킷</title>

  <!-- Open Graph (카카오톡, 슬랙 링크 미리보기) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="UNY CONNECT 일본 인플루언서 소개 | 크리에이터 라인업">
  <meta property="og:description" content="전 라인업 현장 통역 & 전담 디렉터 매니저 동행 케어. 방한 브랜드 촬영 전담 일본 크리에이터 프로필 리스트">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- PapaParse CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <!-- Noto Sans 폰트 로드 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: -0.015em;
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900 antialiased min-h-screen">

  <!-- Header -->
  <header class="bg-white/95 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <div class="flex items-center space-x-3.5">
        <span class="bg-slate-900 text-white text-[11px] font-bold px-3 py-1.5 rounded-full tracking-wider">JAPAN CREATOR</span>
        <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900">일본 인플루언서 프로필</h1>
      </div>

      <!-- 우측 상단: 업데이트/인원수 + 문의하기 버튼 -->
      <div class="flex items-center gap-4 sm:gap-6">
        <div class="text-right flex flex-col justify-center hidden sm:flex">
          <div id="update-date" class="text-xs text-slate-400 font-medium leading-tight mb-0.5"></div>
          <div class="text-xs sm:text-sm text-slate-600 font-medium">등록 크리에이터 <span id="total-count" class="font-bold text-slate-900">0</span>명</div>
        </div>
        <button type="button" onclick="openContactModal()"
           class="inline-flex items-center gap-1.5 px-3.5 py-2 sm:px-4 sm:py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs sm:text-sm font-semibold transition-colors shadow-sm cursor-pointer">
          <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
          <span>문의 및 정리 시트 받기</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Service Guarantee Notice Bar (공통 보증 안내 배너) -->
  <div class="bg-white border-b border-slate-200/80 py-3">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-wrap items-center justify-between gap-3 text-xs sm:text-sm">
      <div class="flex items-center gap-2 text-slate-800 font-medium">
        <span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-slate-900 text-white text-[10px] font-bold">✓</span>
        <span>전 라인업 <strong>현장 통역 &amp; 전담 디렉터 매니저 동행 케어</strong> 기본 지원</span>
      </div>
      <div class="text-slate-400 text-xs hidden sm:block">
        현장 커뮤니케이션 및 브랜드 가이드 촬영을 100% 밀착 서포트합니다.
      </div>
    </div>
  </div>

  <!-- Creator Grid -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div id="loading" class="flex flex-col items-center justify-center py-28 text-slate-400 gap-3">
      <div class="w-8 h-8 border-2 border-slate-900 border-t-transparent rounded-full animate-spin"></div>
      <span class="text-sm font-medium">데이터를 불러오는 중입니다...</span>
    </div>
    <div id="creator-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-7">
      <!-- JavaScript로 카드 렌더링 -->
    </div>
  </main>

  <!-- Contact Modal (문의하기 & 시트 열람 팝업) -->
  <div id="contact-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm transition-opacity duration-200">
    <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl border border-slate-100 overflow-hidden transform transition-all duration-200 scale-95 opacity-0" id="modal-container">
      
      <!-- Modal Header -->
      <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between">
        <div>
          <h3 class="text-lg font-bold text-slate-900" id="modal-title">프로젝트 문의 및 정리 시트 요청</h3>
          <p class="text-xs text-slate-500 mt-0.5" id="modal-desc">간단한 정보를 남겨주시면 공개용 정리 시트가 바로 오픈됩니다.</p>
        </div>
        <button type="button" onclick="closeContactModal()" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg hover:bg-slate-100 transition-colors">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

<!-- Step 1: Modal Body (Form) -->
      <form id="inquiry-form" onsubmit="handleInquirySubmit(event)" class="p-6 space-y-4">
        <div>
          <label for="user-company" class="block text-xs font-bold text-slate-700 mb-1.5">회사명 / 브랜드명 <span class="text-rose-500">*</span></label>
          <input type="text" id="user-company" required placeholder="예: (주)유니커넥트 또는 브랜드명"
                 class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 focus:bg-white transition-all">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label for="user-name" class="block text-xs font-bold text-slate-700 mb-1.5">담당자명 / 직책 <span class="text-rose-500">*</span></label>
            <input type="text" id="user-name" required placeholder="홍길동 팀장"
                   class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 focus:bg-white transition-all">
          </div>

          <div>
            <label for="user-contact" class="block text-xs font-bold text-slate-700 mb-1.5">연락처 (이메일/휴대폰) <span class="text-rose-500">*</span></label>
            <input type="text" id="user-contact" required placeholder="010-0000-0000 / email@co.kr"
                   class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 focus:bg-white transition-all">
          </div>
        </div>

        <div>
          <label for="user-message" class="block text-xs font-bold text-slate-700 mb-1.5">문의 내용 (선택)</label>
          <textarea id="user-message" rows="3" placeholder="관심 있는 크리에이터 번호(#01 등)나 일정, 브랜드 카테고리를 남겨주시면 세부 견적 조율에 도움이 됩니다."
                    class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 focus:bg-white transition-all resize-none"></textarea>
        </div>

        <div class="pt-2 flex items-center justify-end gap-2.5">
          <button type="button" onclick="closeContactModal()"
                  class="px-4 py-2.5 text-xs sm:text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition-colors cursor-pointer">
            취소
          </button>
          <button type="submit" id="submit-btn"
                  class="px-5 py-2.5 text-xs sm:text-sm font-bold text-white bg-slate-900 hover:bg-slate-800 rounded-xl transition-colors shadow-sm cursor-pointer">
            제출 후 전체 리스트 보기
          </button>
        </div>
      </form>

      <!-- Step 2: Modal Body (Success & Direct URL Link) -->
      <div id="inquiry-success-step" class="hidden p-8 text-center space-y-5">
        <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto">
          <i data-lucide="check" class="w-6 h-6"></i>
        </div>
        <div class="space-y-1.5">
          <h4 class="text-lg font-bold text-slate-900">문의가 정상 접수되었습니다!</h4>
          <p class="text-xs text-slate-500 leading-relaxed">
            담당자가 내용을 확인 후 남겨주신 연락처로 신속히 회신드리겠습니다.<br>
            아래 버튼을 눌러 라인업 정리 시트를 확인하세요.
          </p>
        </div>

        <div class="pt-2">
          <!-- 공개용 시트 또는 엑셀 HTML 뷰어 URL -->
          <a id="sheet-open-link" href="#" target="_blank" rel="noopener"
             class="inline-flex items-center justify-center gap-2 w-full px-5 py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-sm font-bold shadow-sm transition-all">
            <span>크리에이터 공개용 시트 바로 열기</span>
            <i data-lucide="external-link" class="w-4 h-4"></i>
          </a>
        </div>

        <div class="pt-1">
          <button type="button" onclick="closeContactModal()" class="text-xs text-slate-400 hover:text-slate-600 underline">
            창 닫기
          </button>
        </div>
      </div>

    </div>
  </div>

  <script>
    // 1. 구글 시트 CSV 파싱용 URL
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSCBS5qVBjgYyvbZ7mTpeqLAMmSFcsSOeSIxt74BsZxRe-AiRcE-tzdUkLBsHbYjPXPkxA5h4Q5qp6G/pub?gid=836201385&single=true&output=csv";

    // 2. 제출 완료 후 열어줄 [공개용 구글 시트(또는 웹게시)] URL
    const PUBLIC_SHEET_VIEW_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSCBS5qVBjgYyvbZ7mTpeqLAMmSFcsSOeSIxt74BsZxRe-AiRcE-tzdUkLBsHbYjPXPkxA5h4Q5qp6G/pubhtml?gid=588148010&single=true";

    // 모달 제어
    function openContactModal() {
      // 스텝 초기화 (폼 보이기, 완료창 숨기기)
      document.getElementById('inquiry-form').classList.remove('hidden');
      document.getElementById('inquiry-success-step').classList.add('hidden');
      document.getElementById('modal-title').innerText = "프로젝트 문의 및 정리 시트 요청";
      document.getElementById('modal-desc').innerText = "간단한 정보를 남겨주시면 공개용 정리 시트가 바로 오픈됩니다.";

      const modal = document.getElementById('contact-modal');
      const container = document.getElementById('modal-container');
      modal.classList.remove('hidden');
      requestAnimationFrame(() => {
        container.classList.remove('scale-95', 'opacity-0');
        container.classList.add('scale-100', 'opacity-100');
      });
      document.body.style.overflow = 'hidden';
      lucide.createIcons();
    }

    function closeContactModal() {
      const modal = document.getElementById('contact-modal');
      const container = document.getElementById('modal-container');
      container.classList.remove('scale-100', 'opacity-100');
      container.classList.add('scale-95', 'opacity-0');
      setTimeout(() => {
        modal.classList.add('hidden');
        document.body.style.overflow = 'auto';
      }, 200);
    }

    document.getElementById('contact-modal').addEventListener('click', (e) => {
      if (e.target.id === 'contact-modal') closeContactModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeContactModal();
    });

// 1. 위 1단계에서 복사한 구글 Apps Script 웹 앱 URL을 따옴표 안에 넣어주세요
    const APPS_SCRIPT_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxrix85xvzlTyr1fP6ntG9zBwS7Zx67-YfjEqOXoa00ZV52PAOyNkFYAt1UA23YF39N/exec";

    // 2. 폼 제출 시 백그라운드 전송 처리 (메일 창이 뜨지 않음)
    async function handleInquirySubmit(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = "전송 중...";

      const payload = {
        company: document.getElementById('user-company').value.trim(),
        name: document.getElementById('user-name').value.trim(),
        contact: document.getElementById('user-contact').value.trim(),
        message: document.getElementById('user-message').value.trim()
      };

      try {
        // 구글 스크립트로 데이터 전송 (방문자 PC 메일 앱 안 열림)
        await fetch(APPS_SCRIPT_WEBAPP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        // Step 2: 완료 화면으로 전환
        document.getElementById('inquiry-form').classList.add('hidden');
        document.getElementById('inquiry-success-step').classList.remove('hidden');
        document.getElementById('modal-title').innerText = "접수 완료";
        document.getElementById('modal-desc').innerText = "확인 후 신속히 회신드리겠습니다.";

        const sheetLinkBtn = document.getElementById('sheet-open-link');
        sheetLinkBtn.href = PUBLIC_SHEET_VIEW_URL;

        document.getElementById('inquiry-form').reset();
        lucide.createIcons();

      } catch (err) {
        alert("전송 중 일시적인 오류가 발생했습니다. 다시 시도해 주세요.");
        console.error(err);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "제출 후 전체 리스트 보기";
      }
    }

    function formatUrl(url) {
      if (!url) return "";
      const trimmed = url.trim();
      if (trimmed.startsWith("http://") || trimmed.startsWith("https://")) return trimmed;
      if (trimmed.startsWith("@")) return `https://www.instagram.com/${trimmed.slice(1)}/`;
      return `https://${trimmed}`;
    }

    async function loadSheetData() {
      try {
        const response = await fetch(GOOGLE_SHEET_CSV_URL);
        const csvText = await response.text();

        Papa.parse(csvText, {
          header: false,
          skipEmptyLines: true,
          complete: function(results) {
            const rows = results.data;
            if (rows.length < 3) return;

            let updateText = "";
            if (rows[0]) {
              const rawDateStr = rows[0][1] || rows[0].join(" ");
              const dateMatch = rawDateStr.match(/(\d{4})[.\-\/](\d{1,2})/);
              if (dateMatch) {
                updateText = `${dateMatch[1]}.${dateMatch[2].padStart(2, '0')} 기준`;
              }
            }

            const dateEl = document.getElementById('update-date');
            if (dateEl && updateText) dateEl.innerText = updateText;

            const headers = rows[1].map(h => (h || "").trim().toLowerCase().replace(/\s+/g, ''));
            const findIdx = (keywords) => headers.findIndex(h => keywords.some(k => h.includes(k.toLowerCase())));

            const idxShootType = findIdx(['촬영형태']);
            const idxInstaLink = findIdx(['instagram링크', '인스타그램링크', 'instagram']);
            const idxInstaFollower = idxInstaLink !== -1 ? idxInstaLink + 1 : -1;
            const idxInstaMedian = idxInstaLink !== -1 ? idxInstaLink + 3 : -1;
            const idxInstaER = idxInstaLink !== -1 ? idxInstaLink + 4 : -1;

            const idxTiktokLink = findIdx(['tiktok링크', '틱톡링크', 'tiktok']);
            const idxTiktokFollower = idxTiktokLink !== -1 ? idxTiktokLink + 1 : -1;

            const idxYoutubeLink = findIdx(['youtube링크', '유튜브링크', 'youtube']);
            const idxYoutubeFollower = idxYoutubeLink !== -1 ? idxYoutubeLink + 1 : -1;

            const creators = [];
            for (let i = 2; i < rows.length; i++) {
              const r = rows[i];
              if (!r[0] || isNaN(r[0])) continue;

              const instaRaw = idxInstaLink !== -1 ? r[idxInstaLink] : "";
              const tiktokRaw = idxTiktokLink !== -1 ? r[idxTiktokLink] : "";
              const youtubeRaw = idxYoutubeLink !== -1 ? r[idxYoutubeLink] : "";

              creators.push({
                no: r[0] || "",
                nameEn: r[1] || "",
                accountName: r[2] || "",
                genre: r[3] || "",
                gender: r[4] || "",
                shootType: (idxShootType !== -1 && r[idxShootType]) ? r[idxShootType] : "",
                insta: {
                  link: formatUrl(instaRaw),
                  followers: (idxInstaFollower !== -1 && r[idxInstaFollower]) ? r[idxInstaFollower].trim() : "-",
                  medianViews: (idxInstaMedian !== -1 && r[idxInstaMedian]) ? r[idxInstaMedian].trim() : "-",
                  er: (idxInstaER !== -1 && r[idxInstaER]) ? r[idxInstaER].trim() : "-"
                },
                tiktok: {
                  link: formatUrl(tiktokRaw),
                  followers: (idxTiktokFollower !== -1 && r[idxTiktokFollower]) ? r[idxTiktokFollower].trim() : ""
                },
                youtube: {
                  link: formatUrl(youtubeRaw),
                  followers: (idxYoutubeFollower !== -1 && r[idxYoutubeFollower]) ? r[idxYoutubeFollower].trim() : ""
                }
              });
            }

            renderCards(creators);
          }
        });
      } catch (err) {
        document.getElementById('loading').innerHTML = `
          <div class="text-rose-500 font-medium text-sm">데이터를 불러오는 중 오류가 발생했습니다.</div>
        `;
        console.error(err);
      }
    }

    function renderCards(data) {
      document.getElementById('loading').style.display = 'none';
      const grid = document.getElementById('creator-grid');
      const countEl = document.getElementById('total-count');
      grid.innerHTML = '';
      countEl.innerText = data.length;

      data.forEach(c => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md hover:border-slate-300 transition-all duration-200 flex flex-col justify-between overflow-hidden p-6";

        const tags = [];
        if (c.gender) {
          const genderStyle = c.gender === '여' 
            ? 'bg-rose-50 text-rose-600 border border-rose-100' 
            : 'bg-blue-50 text-blue-600 border border-blue-100';
          tags.push(`<span class="${genderStyle} text-[11px] px-2 py-0.5 rounded font-semibold">${c.gender}</span>`);
        }
        if (c.genre) tags.push(`<span class="bg-slate-100 text-slate-700 text-[11px] px-2.5 py-0.5 rounded font-medium">${c.genre}</span>`);
        if (c.shootType) tags.push(`<span class="bg-emerald-50 text-emerald-700 border border-emerald-100 text-[11px] px-2 py-0.5 rounded font-medium">${c.shootType}</span>`);

        const hasTiktok = Boolean(c.tiktok.link || (c.tiktok.followers && c.tiktok.followers !== '-'));
        const hasYoutube = Boolean(c.youtube.link || (c.youtube.followers && c.youtube.followers !== '-'));

        let multiChannelHtml = '';
        if (hasTiktok || hasYoutube) {
          multiChannelHtml = `
            <div class="flex items-center justify-between pt-3 mt-4 border-t border-slate-100 text-xs text-slate-500">
              <span class="font-medium text-slate-400">멀티 채널 보유</span>
              <div class="flex items-center gap-1.5">
                ${hasTiktok ? '<span class="inline-flex items-center px-2 py-0.5 rounded-md bg-slate-100 text-slate-800 text-[11px] font-semibold border border-slate-200">TikTok</span>' : ''}
                ${hasYoutube ? '<span class="inline-flex items-center px-2 py-0.5 rounded-md bg-red-50 text-red-600 text-[11px] font-semibold border border-red-100">YouTube</span>' : ''}
              </div>
            </div>
          `;
        }

        const formattedNo = `#${String(c.no).padStart(2, '0')}`;

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between gap-2 mb-2.5">
              <span class="inline-flex items-center justify-center px-2 py-0.5 rounded-md bg-slate-100 border border-slate-200/60 text-[11px] font-bold text-slate-500 tracking-wider">
                ${formattedNo}
              </span>
              <div class="flex flex-wrap gap-1.5 justify-end">
                ${tags.join('')}
              </div>
            </div>

            <div class="mb-4">
              ${c.nameEn ? `<div class="text-xs font-extrabold text-slate-800 tracking-wider uppercase leading-none mb-1">${c.nameEn}</div>` : ''}
              <h3 class="text-base font-bold text-slate-900 leading-snug line-clamp-2 select-none">
                ${c.accountName}
              </h3>
            </div>

            <div class="rounded-xl border border-slate-200 bg-slate-50/60 p-4">
              <div class="flex items-center justify-between mb-3.5">
                <span class="text-xs font-bold text-slate-900 tracking-tight">Instagram</span>
                ${c.insta.link ? `
                  <a href="${c.insta.link}" target="_blank" rel="noopener" class="text-xs font-medium text-slate-500 hover:text-slate-900 flex items-center transition-colors">
                    SNS 바로가기 <i data-lucide="external-link" class="w-3 h-3 ml-1"></i>
                  </a>
                ` : ''}
              </div>

              <div class="grid grid-cols-3 gap-2 text-center">
                <div class="bg-white rounded-lg py-2.5 px-1 border border-slate-200 shadow-sm">
                  <div class="text-[10px] text-slate-400 font-medium mb-0.5">팔로워</div>
                  <div class="text-sm sm:text-base font-bold text-slate-800 tracking-tight">${c.insta.followers}</div>
                </div>
                <div class="bg-white rounded-lg py-2.5 px-1 border-2 border-slate-900 shadow-sm">
                  <div class="text-[10px] text-slate-900 font-bold mb-0.5">조회수 중앙값</div>
                  <div class="text-sm sm:text-base font-extrabold text-slate-900 tracking-tight">${c.insta.medianViews}</div>
                </div>
                <div class="bg-white rounded-lg py-2.5 px-1 border border-slate-200 shadow-sm">
                  <div class="text-[10px] text-slate-400 font-medium mb-0.5">ER(참여율)</div>
                  <div class="text-sm sm:text-base font-bold text-slate-800 tracking-tight">${c.insta.er}</div>
                </div>
              </div>
            </div>

            ${multiChannelHtml}
          </div>
        `;

        grid.appendChild(card);
      });

      lucide.createIcons();
    }

    loadSheetData();
    lucide.createIcons();
  </script>
</body>
</html>
