    function renderCards(data) {
      const grid = document.getElementById('creator-grid');
      const countEl = document.getElementById('total-count');
      grid.innerHTML = '';
      countEl.innerText = data.length;

      data.forEach(c => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-all overflow-hidden flex flex-col justify-between";

        // 태그 빌드
        const tags = [];
        tags.push(`<span class="bg-slate-100 text-slate-700 text-xs px-2.5 py-1 rounded-md font-semibold">${c.genre}</span>`);
        if (c.gender) tags.push(`<span class="bg-blue-50 text-blue-700 text-xs px-2 py-1 rounded-md font-medium">${c.gender}</span>`);
        if (c.shootType) tags.push(`<span class="bg-emerald-50 text-emerald-700 text-xs px-2 py-1 rounded-md font-medium">${c.shootType}</span>`);
        if (c.koreanLevel) tags.push(`<span class="bg-amber-50 text-amber-700 text-xs px-2 py-1 rounded-md font-medium">${c.koreanLevel}</span>`);

        card.innerHTML = `
          <div class="p-6">
            <!-- Header -->
            <div class="flex items-start justify-between gap-2 mb-3">
              <span class="text-xs font-bold text-slate-400">NO.${c.no}</span>
              <div class="flex flex-wrap gap-1 justify-end">
                ${tags.join('')}
              </div>
            </div>
            
            <!-- Creator Name -->
            <h3 class="text-base font-bold text-slate-900 line-clamp-2 mb-4 hover:text-rose-600 transition">

            </h3>

                <a href="${c.insta.link}" target="_blank" class="hover:underline flex items-center">프로필 <i data-lucide="external-link" class="w-3 h-3 ml-0.5"></i></a>

                </div>
                <div class="bg-white/80 rounded-lg p-2 ring-1 ring-rose-200">

                  <div class="text-sm font-extrabold text-rose-600">${c.insta.medianViews}</div>
                </div>
                <div class="bg-white/80 rounded-lg p-2">
                  <div class="text-[10px] text-slate-500">ER(참여율)</div>
                  <div class="text-sm font-bold text-slate-800">${c.insta.er}</div>
                </div>

            </div>

    function filterGenre(genre) {
      document.querySelectorAll('.genre-btn').forEach(btn => {
        btn.classList.remove('bg-slate-900', 'text-white');
        btn.classList.add('bg-slate-100', 'text-slate-600');
      });
      event.target.classList.remove('bg-slate-100', 'text-slate-600');
      event.target.classList.add('bg-slate-900', 'text-white');

      if (genre === 'ALL') {
        renderCards(CREATORS);
      } else {
        renderCards(CREATORS.filter(c => c.genre.includes(genre)));
      }
    }

    // 초기 렌더링
