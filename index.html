      countEl.innerText = data.length;

        card.innerHTML = `
          <div class="p-6">
            <!-- Header -->
            <div class="flex items-center justify-between gap-2 mb-4">
              <span class="text-sm font-bold text-slate-400">NO.${c.no}</span>

                <a href="${c.insta.link}" target="_blank" class="hover:underline flex items-center">프로필 <i data-lucide="external-link" class="w-3.5 h-3.5 ml-1"></i></a>

                  <div class="text-xs text-slate-500 mb-0.5">ER(참여율)</div>
                  <div class="text-base sm:text-lg font-bold text-slate-800">${c.insta.er}</div>
