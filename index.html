<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일본 인플루언서 프로필</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- PapaParse CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <!-- Noto Sans 폰트 로드 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: -0.015em;
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900 antialiased min-h-screen">

  <!-- Header -->
  <header class="bg-white/95 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <div class="flex items-center space-x-3.5">
        <span class="bg-slate-900 text-white text-[11px] font-bold px-3 py-1.5 rounded-full tracking-wider">JAPAN CREATOR</span>
        <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900">일본 인플루언서 프로필</h1>
      </div>
      <!-- 우측 상단: 업데이트(년/월) 바로 아래 등록 크리에이터 -->
      <div class="text-right flex flex-col justify-center">
        <div id="update-date" class="text-xs text-slate-400 font-medium leading-tight mb-0.5"></div>
        <div class="text-xs sm:text-sm text-slate-600 font-medium">등록 크리에이터 <span id="total-count" class="font-bold text-slate-900">0</span>명</div>
      </div>
    </div>
  </header>

  <!-- Creator Grid -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div id="loading" class="flex flex-col items-center justify-center py-28 text-slate-400 gap-3">
      <div class="w-8 h-8 border-2 border-slate-900 border-t-transparent rounded-full animate-spin"></div>
      <span class="text-sm font-medium">데이터를 불러오는 중입니다...</span>
    </div>
    <div id="creator-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-7">
      <!-- JavaScript로 카드 렌더링 -->
    </div>
  </main>

  <script>
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSCBS5qVBjgYyvbZ7mTpeqLAMmSFcsSOeSIxt74BsZxRe-AiRcE-tzdUkLBsHbYjPXPkxA5h4Q5qp6G/pub?gid=588148010&single=true&output=csv";

    async function loadSheetData() {
      try {
        const response = await fetch(GOOGLE_SHEET_CSV_URL);
        const csvText = await response.text();

        Papa.parse(csvText, {
          header: false,
          skipEmptyLines: true,
          complete: function(results) {
            const rows = results.data;
            if (rows.length < 3) return;

            // 1행에서 업데이트 날짜 추출 (YYYY.MM 기준)
            let updateText = "";
            if (rows.length > 0 && rows[0]) {
              const rawDateStr = rows[0][1] || rows[0].join(" ");
              const dateMatch = rawDateStr.match(/(\d{4})[.\-\/](\d{1,2})/);
              if (dateMatch) {
                const year = dateMatch[1];
                const month = dateMatch[2].padStart(2, '0');
                updateText = `${year}.${month} 기준`;
              }
            }

            const dateEl = document.getElementById('update-date');
            if (dateEl) {
              dateEl.innerText = updateText;
            }

            // 2행(헤더)을 기반으로 정확한 컬럼 위치 자동 매핑
            const headers = rows[1].map(h => (h || "").trim().toLowerCase().replace(/\s+/g, ''));
            
            const findIdx = (keywords) => {
              return headers.findIndex(h => keywords.some(k => h.includes(k.toLowerCase())));
            };

            // 플랫폼별 컬럼 위치 정확히 산출
            const idxNo = 0;
            const idxNameEn = 1;
            const idxAccount = 2;
            const idxGenre = 3;
            const idxGender = 4;
            const idxShootType = findIdx(['촬영형태']);

            // 인스타그램 구간
            const idxInstaLink = findIdx(['instagram링크', '인스타그램링크', 'instagram']);
            const idxInstaFollower = idxInstaLink + 1;
            const idxInstaMedian = idxInstaLink + 3; // 조회수 중앙값
            const idxInstaER = idxInstaLink + 4;     // ER

            // 틱톡 구간
            const idxTiktokLink = findIdx(['tiktok링크', '틱톡링크', 'tiktok']);
            const idxTiktokFollower = idxTiktokLink !== -1 ? idxTiktokLink + 1 : -1;

            // 유튜브 구간
            const idxYoutubeLink = findIdx(['youtube링크', '유튜브링크', 'youtube']);
            const idxYoutubeFollower = idxYoutubeLink !== -1 ? idxYoutubeLink + 1 : -1;

            // 3행부터 실제 크리에이터 데이터 파싱
            const creators = [];
            for (let i = 2; i < rows.length; i++) {
              const r = rows[i];
              if (!r[0] || isNaN(r[0])) continue;

              creators.push({
                no: r[idxNo] || "",
                nameEn: r[idxNameEn] || "",
                accountName: r[idxAccount] || "",
                genre: r[idxGenre] || "",
                gender: r[idxGender] || "",
                shootType: (idxShootType !== -1 && r[idxShootType]) ? r[idxShootType] : "",
                insta: {
                  link: (idxInstaLink !== -1 && r[idxInstaLink]) ? r[idxInstaLink].trim() : "",
                  followers: (idxInstaFollower !== -1 && r[idxInstaFollower]) ? r[idxInstaFollower].trim() : "-",
                  medianViews: (idxInstaMedian !== -1 && r[idxInstaMedian]) ? r[idxInstaMedian].trim() : "-",
                  er: (idxInstaER !== -1 && r[idxInstaER]) ? r[idxInstaER].trim() : "-"
                },
                tiktok: {
                  link: (idxTiktokLink !== -1 && r[idxTiktokLink]) ? r[idxTiktokLink].trim() : "",
                  followers: (idxTiktokFollower !== -1 && r[idxTiktokFollower]) ? r[idxTiktokFollower].trim() : ""
                },
                youtube: {
                  link: (idxYoutubeLink !== -1 && r[idxYoutubeLink]) ? r[idxYoutubeLink].trim() : "",
                  followers: (idxYoutubeFollower !== -1 && r[idxYoutubeFollower]) ? r[idxYoutubeFollower].trim() : ""
                }
              });
            }

            renderCards(creators);
          }
        });
      } catch (err) {
        document.getElementById('loading').innerHTML = `
          <div class="text-rose-500 font-medium text-sm">데이터를 불러오는 중 오류가 발생했습니다.</div>
        `;
        console.error(err);
      }
    }

    function renderCards(data) {
      document.getElementById('loading').style.display = 'none';
      const grid = document.getElementById('creator-grid');
      const countEl = document.getElementById('total-count');
      grid.innerHTML = '';
      countEl.innerText = data.length;

      data.forEach(c => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl border border-slate-200 shadow-xs hover:shadow-md hover:border-slate-300 transition-all duration-200 flex flex-col justify-between overflow-hidden";

        // 태그 빌드: 성별이 항상 맨 앞
        const tags = [];
        if (c.gender) {
          const genderStyle = c.gender === '여' 
            ? 'bg-rose-50 text-rose-600 border border-rose-100' 
            : 'bg-blue-50 text-blue-600 border border-blue-100';
          tags.push(`<span class="${genderStyle} text-[11px] px-2 py-0.5 rounded font-semibold">${c.gender}</span>`);
        }
        if (c.genre) tags.push(`<span class="bg-slate-100 text-slate-700 text-[11px] px-2.5 py-0.5 rounded font-medium">${c.genre}</span>`);
        if (c.shootType) tags.push(`<span class="bg-emerald-50 text-emerald-700 border border-emerald-100 text-[11px] px-2 py-0.5 rounded font-medium">${c.shootType}</span>`);

        // 멀티 채널 뱃지 빌드 (링크 유무 및 팔로워 기준 자동 판별)
        const hasTiktok = (c.tiktok.link && c.tiktok.link.startsWith('http')) || (c.tiktok.followers && c.tiktok.followers !== '-' && c.tiktok.followers.trim() !== '');
        const hasYoutube = (c.youtube.link && c.youtube.link.startsWith('http')) || (c.youtube.followers && c.youtube.followers !== '-' && c.youtube.followers.trim() !== '');

        let multiChannelHtml = '';
        if (hasTiktok || hasYoutube) {
          multiChannelHtml = `
            <div class="flex items-center justify-between pt-3 mt-4 border-t border-slate-100 text-xs text-slate-500">
              <span class="font-medium text-slate-400">멀티 채널 보유</span>
              <div class="flex items-center gap-1.5">
                ${hasTiktok ? '<span class="inline-flex items-center px-2 py-0.5 rounded-md bg-slate-100 text-slate-800 text-[11px] font-semibold border border-slate-200">TikTok</span>' : ''}
                ${hasYoutube ? '<span class="inline-flex items-center px-2 py-0.5 rounded-md bg-red-50 text-red-600 text-[11px] font-semibold border border-red-100">YouTube</span>' : ''}
              </div>
            </div>
          `;
        }

        // 인덱스 번호 포맷팅 (#01, #02, ...)
        const formattedNo = `#${String(c.no).padStart(2, '0')}`;

        card.innerHTML = `
          <div class="p-6">
            <!-- Header (Index Badge & Tags) -->
            <div class="flex items-center justify-between gap-2 mb-4">
              <span class="inline-flex items-center justify-center px-2 py-0.5 rounded-md bg-slate-100 border border-slate-200/60 text-[11px] font-bold text-slate-500 tracking-wider">
                ${formattedNo}
              </span>
              <div class="flex flex-wrap gap-1.5 justify-end">
                ${tags.join('')}
              </div>
            </div>
            
            <!-- Creator Profile Title & Name -->
            <div class="mb-5 min-h-[54px] flex flex-col justify-end">
              ${c.nameEn ? `<div class="text-sm font-extrabold text-slate-800 tracking-wider uppercase mb-0.5">${c.nameEn}</div>` : ''}
              <h3 class="text-base font-semibold text-slate-900 leading-snug line-clamp-2 select-none">
                ${c.accountName}
              </h3>
            </div>

            <!-- Main Metric: Instagram -->
            <div class="rounded-xl border border-slate-200/90 bg-slate-50/60 p-4">
              <div class="flex items-center justify-between mb-3.5">
                <span class="text-xs font-bold text-slate-900 tracking-tight">Instagram</span>
                ${c.insta.link && c.insta.link.startsWith('http') ? `
                  <a href="${c.insta.link}" target="_blank" rel="noopener" class="text-xs font-medium text-slate-500 hover:text-slate-900 flex items-center transition-colors">
                    SNS 바로가기 <i data-lucide="external-link" class="w-3 h-3 ml-1"></i>
                  </a>
                ` : ''}
              </div>

              <!-- Metrics 3-Columns -->
              <div class="grid grid-cols-3 gap-2 text-center">
                <div class="bg-white rounded-lg py-2.5 px-1 border border-slate-200/70 shadow-2xs">
                  <div class="text-[10px] text-slate-400 font-medium mb-0.5">팔로워</div>
                  <div class="text-sm sm:text-base font-bold text-slate-800 tracking-tight">${c.insta.followers}</div>
                </div>
                <div class="bg-white rounded-lg py-2.5 px-1 border-2 border-slate-900 shadow-2xs">
                  <div class="text-[10px] text-slate-900 font-bold mb-0.5">조회수 중앙값</div>
                  <div class="text-sm sm:text-base font-extrabold text-slate-900 tracking-tight">${c.insta.medianViews}</div>
                </div>
                <div class="bg-white rounded-lg py-2.5 px-1 border border-slate-200/70 shadow-2xs">
                  <div class="text-[10px] text-slate-400 font-medium mb-0.5">ER(참여율)</div>
                  <div class="text-sm sm:text-base font-bold text-slate-800 tracking-tight">${c.insta.er}</div>
                </div>
              </div>
            </div>

            <!-- 멀티 채널 태그 표시 -->
            ${multiChannelHtml}
          </div>

          <!-- Card Footer -->
          <div class="px-6 py-3 bg-slate-50/70 border-t border-slate-100 flex items-center justify-end text-xs">
            <span class="font-medium text-slate-600">현장 통역&디렉터 매니저 동행</span>
          </div>
        `;

        grid.appendChild(card);
      });

      lucide.createIcons();
    }

    loadSheetData();
  </script>
</body>
</html>
