<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일본 인플루언서 프로필</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- PapaParse CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <!-- Noto Sans 폰트 로드 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: -0.015em;
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900 antialiased min-h-screen">

  <!-- Header -->
  <header class="bg-white/95 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <div class="flex items-center space-x-3.5">
        <span class="bg-slate-900 text-white text-[11px] font-bold px-3 py-1.5 rounded-full tracking-wider">JAPAN CREATOR</span>
        <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900">일본 인플루언서 프로필</h1>
      </div>
      <div class="text-right">
        <div id="update-date" class="text-xs text-slate-400 font-medium"></div>
        <div class="text-xs sm:text-sm text-slate-500 font-medium mt-0.5">등록 크리에이터 <span id="total-count" class="font-bold text-slate-900">0</span>명</div>
      </div>
    </div>
  </header>

  <!-- Creator Grid -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div id="loading" class="flex flex-col items-center justify-center py-28 text-slate-400 gap-3">
      <div class="w-8 h-8 border-2 border-slate-900 border-t-transparent rounded-full animate-spin"></div>
      <span class="text-sm font-medium">데이터를 불러오는 중입니다...</span>
    </div>
    <div id="creator-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-7">
      <!-- JavaScript로 카드 렌더링 -->
    </div>
  </main>

  <script>
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSCBS5qVBjgYyvbZ7mTpeqLAMmSFcsSOeSIxt74BsZxRe-AiRcE-tzdUkLBsHbYjPXPkxA5h4Q5qp6G/pub?gid=588148010&single=true&output=csv";

    async function loadSheetData() {
      try {
        const response = await fetch(GOOGLE_SHEET_CSV_URL);
        const csvText = await response.text();

        Papa.parse(csvText, {
          header: false,
          skipEmptyLines: true,
          complete: function(results) {
            const rows = results.data;
            if (rows.length < 3) return;

            // 1행에서 업데이트 날짜 추출
            const firstCell = rows[0][0] || "";
            const dateMatch = firstCell.match(/\d{4}[.-]\d{2}[.-]\d{2}/);
            const dateEl = document.getElementById('update-date');
            if (dateMatch) {
              dateEl.innerText = `업데이트: ${dateMatch[0]} 기준`;
            } else {
              dateEl.innerText = '';
            }

            // 3행부터 실제 데이터 파싱
            const creators = [];
            for (let i = 2; i < rows.length; i++) {
              const r = rows[i];
              if (!r[0] || isNaN(r[0])) continue;

              creators.push({
                no: r[0],               // A: NO
                nameEn: r[1] || "",     // B: 영문명
                accountName: r[2],      // C: 계정명
                genre: r[3] || "",      // D: 콘텐츠 장르
                gender: r[4] || "",     // E: 성별
                shootType: r[8] || "",  // I: 촬영 형태
                koreanLevel: r[9] || "",// J: 한국어 소통
                insta: {
                  link: r[11] || "",
                  followers: r[12] || "-",
                  medianViews: r[14] || "-",
                  er: r[15] || "-"
                },
                tiktok: {
                  link: r[16] || "",
                  followers: r[17] || "",
                  medianViews: r[19] || ""
                },
                youtube: {
                  link: r[21] || "",
                  followers: r[22] || "",
                  medianViews: r[23] || ""
                }
              });
            }

            renderCards(creators);
          }
        });
      } catch (err) {
        document.getElementById('loading').innerHTML = `
          <div class="text-rose-500 font-medium text-sm">데이터를 불러오는 중 오류가 발생했습니다.</div>
        `;
        console.error(err);
      }
    }

    function renderCards(data) {
      document.getElementById('loading').style.display = 'none';
      const grid = document.getElementById('creator-grid');
      const countEl = document.getElementById('total-count');
      grid.innerHTML = '';
      countEl.innerText = data.length;

      data.forEach(c => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl border border-slate-200/90 shadow-xs hover:shadow-md hover:border-slate-300 transition-all duration-200 flex flex-col justify-between overflow-hidden";

        // 태그 빌드: 성별이 항상 맨 앞
        const tags = [];
        if (c.gender) {
          const genderStyle = c.gender === '여' 
            ? 'bg-rose-50 text-rose-600 border border-rose-100' 
            : 'bg-blue-50 text-blue-600 border border-blue-100';
          tags.push(`<span class="${genderStyle} text-[11px] px-2 py-0.5 rounded font-semibold">${c.gender}</span>`);
        }
        if (c.genre) tags.push(`<span class="bg-slate-100 text-slate-700 text-[11px] px-2.5 py-0.5 rounded font-medium">${c.genre}</span>`);
        if (c.shootType) tags.push(`<span class="bg-emerald-50 text-emerald-700 border border-emerald-100 text-[11px] px-2 py-0.5 rounded font-medium">${c.shootType}</span>`);
        if (c.koreanLevel) tags.push(`<span class="bg-amber-50 text-amber-700 border border-amber-100 text-[11px] px-2 py-0.5 rounded font-medium">${c.koreanLevel}</span>`);

        // 서브채널 (TikTok / YouTube) 정돈된 룩
        let subChannelsHtml = '';
        const hasTiktok = c.tiktok.followers && c.tiktok.followers !== '-' && c.tiktok.followers.trim() !== '';
        const hasYoutube = c.youtube.followers && c.youtube.followers !== '-' && c.youtube.followers.trim() !== '';

        if (hasTiktok || hasYoutube) {
          subChannelsHtml += '<div class="space-y-2 mt-4 pt-4 border-t border-slate-100">';
          if (hasTiktok) {
            subChannelsHtml += `
              <div class="grid grid-cols-[70px_1fr_1.1fr] items-center px-3 py-2 rounded-xl bg-slate-50 border border-slate-100 text-[11px] sm:text-xs">
                <span class="font-semibold text-slate-900 flex items-center gap-1.5">
                  <span class="w-1.5 h-1.5 rounded-full bg-slate-900"></span> TikTok
                </span>
                <div class="text-slate-500 pr-2 border-r border-slate-200 truncate">
                  팔로워 <b class="text-slate-800 font-semibold">${c.tiktok.followers}</b>
                </div>
                <div class="text-slate-500 pl-3 truncate">
                  조회수 중앙값 <b class="text-slate-800 font-semibold">${c.tiktok.medianViews || '-'}</b>
                </div>
              </div>`;
          }
          if (hasYoutube) {
            subChannelsHtml += `
              <div class="grid grid-cols-[70px_1fr_1.1fr] items-center px-3 py-2 rounded-xl bg-slate-50 border border-slate-100 text-[11px] sm:text-xs">
                <span class="font-semibold text-rose-600 flex items-center gap-1.5">
                  <span class="w-1.5 h-1.5 rounded-full bg-rose-600"></span> YouTube
                </span>
                <div class="text-slate-500 pr-2 border-r border-slate-200 truncate">
                  구독자 <b class="text-slate-800 font-semibold">${c.youtube.followers}</b>
                </div>
                <div class="text-slate-500 pl-3 truncate">
                  조회수 중앙값 <b class="text-slate-800 font-semibold">${c.youtube.medianViews || '-'}</b>
                </div>
              </div>`;
          }
          subChannelsHtml += '</div>';
        }

        card.innerHTML = `
          <div class="p-6">
            <!-- Header (NO & Tags) -->
            <div class="flex items-center justify-between gap-2 mb-4">
              <span class="text-xs font-bold text-slate-400 tracking-wider">NO.${c.no}</span>
              <div class="flex flex-wrap gap-1.5 justify-end">
                ${tags.join('')}
              </div>
            </div>
            
            <!-- Creator Profile Title & Name -->
            <div class="mb-5 min-h-[58px] flex flex-col justify-end">
              ${c.nameEn ? `<div class="text-[11px] font-bold text-slate-400 tracking-widest uppercase mb-1">${c.nameEn}</div>` : ''}
              <h3 class="text-lg font-bold text-slate-900 leading-snug line-clamp-2 select-none">
                ${c.accountName}
              </h3>
            </div>

            <!-- Main Metric: Instagram -->
            <div class="rounded-xl border border-slate-200/80 bg-slate-50/50 p-4">
              <!-- Perfect Aligned Instagram Header -->
              <div class="flex items-center justify-between h-6 mb-3.5">
                <div class="flex items-center gap-2">
                  <span class="inline-flex items-center justify-center w-5 h-5 rounded-md bg-gradient-to-tr from-amber-500 via-rose-500 to-purple-600 text-white">
                    <i data-lucide="instagram" class="w-3.5 h-3.5"></i>
                  </span>
                  <span class="text-xs font-bold text-slate-800 tracking-tight leading-none">Instagram</span>
                </div>
                ${c.insta.link && c.insta.link.startsWith('http') ? `
                  <a href="${c.insta.link}" target="_blank" rel="noopener" class="text-xs font-medium text-slate-500 hover:text-slate-900 flex items-center transition-colors leading-none">
                    SNS 바로가기 <i data-lucide="external-link" class="w-3 h-3 ml-1"></i>
                  </a>
                ` : ''}
              </div>

              <!-- Metrics 3-Columns -->
              <div class="grid grid-cols-3 gap-2 text-center">
                <div class="bg-white rounded-lg py-2.5 px-1 border border-slate-200/60 shadow-xs">
                  <div class="text-[10px] text-slate-400 font-medium mb-0.5">팔로워</div>
                  <div class="text-sm sm:text-base font-bold text-slate-800 tracking-tight">${c.insta.followers}</div>
                </div>
                <div class="bg-white rounded-lg py-2.5 px-1 border-2 border-slate-900 shadow-xs">
                  <div class="text-[10px] text-slate-900 font-bold mb-0.5">조회수 중앙값</div>
                  <div class="text-sm sm:text-base font-extrabold text-slate-900 tracking-tight">${c.insta.medianViews}</div>
                </div>
                <div class="bg-white rounded-lg py-2.5 px-1 border border-slate-200/60 shadow-xs">
                  <div class="text-[10px] text-slate-400 font-medium mb-0.5">ER(참여율)</div>
                  <div class="text-sm sm:text-base font-bold text-slate-800 tracking-tight">${c.insta.er}</div>
                </div>
              </div>
            </div>

            <!-- Sub Channels (TikTok / YouTube) -->
            ${subChannelsHtml}
          </div>

          <!-- Card Footer -->
          <div class="px-6 py-3.5 bg-slate-50/70 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
            <span>방한 스케줄 조율 가능</span>
            <span class="font-medium text-slate-600">전담 통역 매니저 배속</span>
          </div>
        `;

        grid.appendChild(card);
      });

      lucide.createIcons();
    }

    loadSheetData();
  </script>
</body>
</html>
